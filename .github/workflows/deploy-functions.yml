# نشر دوال السيرفر (Supabase Edge Functions) تلقائيًا - زي ما Vercel بينشر الواجهة.
# بيشتغل لما ملف جوه supabase/functions يتغيّر على main، أو يدوي من تاب Actions (Run workflow).
#
# محتاج سرّين في GitHub (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SUPABASE_ACCESS_TOKEN : من supabase.com/dashboard/account/tokens (Generate new token)
#   SUPABASE_PROJECT_REF  : كود المشروع (Project Settings -> General -> Reference ID)
# من غيرهم الخطوة بتقف برسالة واضحة ومابتنشرش حاجة.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::لازم تضيف SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_REF في Settings -> Secrets and variables -> Actions، وبعدها شغّل الـ workflow تاني (Run workflow)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy create-user
        run: supabase functions deploy create-user --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy reset-password
        run: supabase functions deploy reset-password --project-ref "$SUPABASE_PROJECT_REF"
